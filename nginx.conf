server {
  listen       80 default_server;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Gzip text-y assets; PWA-friendly cache headers below.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Never cache the shell or the service worker — updates must ship.
  location = /sw.js              { add_header Cache-Control "no-cache"; }
  location = /workbox-ee9d8b34.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location = /index.html         { add_header Cache-Control "no-cache"; }
  location = /                   { add_header Cache-Control "no-cache"; try_files /index.html =404; }

  # Hashed assets are content-addressed — cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else falls back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
