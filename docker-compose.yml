# Décor Studio — local Docker setup.
#
# Default:               docker compose up --build   → web on :8080
# Explicit prod build:   docker compose up --build web
# Hot-reload dev server: docker compose --profile dev up dev   → :5173
#
# The dev profile mounts the source tree so edits round-trip live.
# The web service is the production build that an end user would deploy.

services:
  web:
    build:
      context: .
      target: runtime
    image: decor-studio:latest
    container_name: decor-studio
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    profiles: ["dev"]

volumes:
  node_modules:
