# Décor Studio — local Docker setup.
#
# Two services:
#   web    — production build served by nginx on http://localhost:8080
#   dev    — hot-reloading Vite dev server on http://localhost:5173
#
# Pick one or the other. The dev service mounts the source tree so edits
# round-trip live; the web service is what you'd actually ship.

services:
  web:
    build:
      context: .
      target: runtime
    image: decor-studio:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    profiles: ["web", "default"]

  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    profiles: ["dev"]

volumes:
  node_modules:
